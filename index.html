<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pet Battle: Ultra Difficulty Fix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #050510; overflow: hidden; touch-action: none; font-family: sans-serif; color: white; user-select: none; }
        canvas { background: #050510; display: none; }
        #menu { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #050510; z-index: 100; padding: 20px; }
        .stats-bar { margin-bottom: 20px; color: #ffff00; font-size: 18px; text-shadow: 0 0 10px #ffff00; }
        .pet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; max-height: 45vh; overflow-y: auto; padding: 10px; border: 1px solid #222; border-radius: 10px; }
        .pet-card { border: 2px solid #333; border-radius: 12px; padding: 8px; text-align: center; width: 95px; background: #111; cursor: pointer; }
        .pet-card.selected { border-color: #ff0055; background: #220011; transform: scale(1.05); }
        .pet-card img { width: 50px; height: 50px; border-radius: 8px; pointer-events: none; background: #222; }
        .upgrade-section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; width: 100%; max-width: 350px; margin-bottom: 20px; }
        .up-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; }
        .up-btn { background: #00d2ff; border: none; padding: 5px 12px; border-radius: 5px; color: #000; font-weight: bold; cursor: pointer; }
        #btn-start { padding: 15px 50px; font-size: 22px; background: #ff0055; border: none; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; }
        #hud { position: absolute; top: 10px; width: 100%; display: none; justify-content: space-between; padding: 0 20px; pointer-events: none; z-index: 10; font-size: 18px; }
        #angry-bar-cont { position: absolute; left: 20px; top: 70px; width: 15px; height: 130px; background: #222; border: 2px solid #ff0055; border-radius: 8px; }
        #angry-fill { width: 100%; height: 0%; background: linear-gradient(to top, #ff0055, #ffff00); position: absolute; bottom: 0; }
    </style>
</head>
<body>

<div id="menu">
    <div class="stats-bar">YILDIZ: <span id="total-stars">0</span> ⭐️</div>
    <div id="pet-grid" class="pet-grid"></div>
    <div class="upgrade-section">
        <div class="up-item"><span>CAN: <b id="level-hp">3</b></span><button class="up-btn" onclick="buyUp('hp')">500 ⭐️</button></div>
        <div class="up-item"><span>HIZ: <b id="level-speed">1</b></span><button class="up-btn" onclick="buyUp('speed')">300 ⭐️</button></div>
    </div>
    <button id="btn-start">SAVAŞI BAŞLAT</button>
</div>

<div id="hud">
    <div id="score-txt">SKOR: 0</div>
    <div id="hp-txt">CAN: 3</div>
    <div id="angry-bar-cont"><div id="angry-fill"></div></div>
</div>

<canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const raw = "https://raw.githubusercontent.com/darwin456222-ops/Darwiizl/main/";

    let gameData = JSON.parse(localStorage.getItem('p_data_v4')) || { stars: 0, hpL: 3, spL: 1 };
    function save() { localStorage.setItem('p_data_v4', JSON.stringify(gameData)); refresh(); }
    function refresh() {
        document.getElementById('total-stars').innerText = gameData.stars;
        document.getElementById('level-hp').innerText = gameData.hpL;
        document.getElementById('level-speed').innerText = gameData.spL;
    }
    window.buyUp = (t) => {
        if(t === 'hp' && gameData.stars >= 500) { gameData.stars -= 500; gameData.hpL++; }
        else if(t === 'speed' && gameData.stars >= 300) { gameData.stars -= 300; gameData.spL++; }
        save();
    };

    const petD = [
        { name: "Squeak", img: "squeak.jpg", type: "cross", dmg: 1 },
        { name: "Gus", img: "gus.jpg", type: "pierce", dmg: 2 },
        { name: "Blinky", img: "blinky.jpg", type: "star", dmg: 1 },
        { name: "Dot", img: "dot.jpg", type: "rapid", dmg: 1 },
        { name: "Sugar", img: "sugar.jpg", type: "spread", dmg: 1 },
        { name: "Flip", img: "flip.jpg", type: "boomerang", dmg: 1 },
        { name: "Yeyet", img: "yeyet.png", type: "xshot", dmg: 1 },
        { name: "Moosey", img: "moosey.jpg", type: "horn", dmg: 1 },
        { name: "Hoppy", img: "hoppy.jpg", type: "jump", dmg: 1 }
    ];

    let selectedIdx = 0, score = 0, hp = 3, running = false, frame = 0;
    let enemies = [], bullets = [], helpers = [], imgs = {}, activeP = [];
    let angryL = 0, isAngry = false, shake = 0;
    const player = { x: 0, y: 0, r: 25 };

    const grid = document.getElementById('pet-grid');
    petD.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = `pet-card ${i === 0 ? 'selected' : ''}`;
        card.innerHTML = `<img src="${raw+p.img}" onerror="this.src='https://via.placeholder.com/50?text=Pet'"><p style="font-size:10px">${p.name}</p>`;
        card.onclick = () => {
            document.querySelectorAll('.pet-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected'); selectedIdx = i;
        };
        grid.appendChild(card);
        let img = new Image(); 
        img.src = raw + p.img;
        img.onerror = () => { console.log(p.name + " yuklenemedi, varsayilan kullaniliyor."); };
        imgs[p.name] = img;
    });

    document.getElementById('btn-start').onclick = () => {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        canvas.style.display = 'block';
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        player.x = canvas.width / 2; player.y = canvas.height / 2;
        hp = gameData.hpL;
        document.getElementById('hp-txt').innerText = "CAN: " + hp;
        activeP = [{type: petD[selectedIdx].type, dmg: petD[selectedIdx].dmg}];
        running = true; loop();
    };

    function drawPet(name, x, y, size) {
        try {
            if (imgs[name] && imgs[name].complete && imgs[name].naturalWidth !== 0) {
                ctx.drawImage(imgs[name], x - size/2, y - size/2, size, size);
            } else {
                ctx.fillStyle = "#555";
                ctx.beginPath(); ctx.arc(x, y, size/2, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "#fff"; ctx.font = "10px Arial";
                ctx.fillText(name[0], x-3, y+3);
            }
        } catch(e) {
            ctx.fillStyle = "white"; ctx.fillRect(x-size/2, y-size/2, size, size);
        }
    }

    function loop() {
        if(!running) return;
        frame++;
        
        ctx.setTransform(1,0,0,1,0,0);
        if(shake > 0) {
            ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            shake *= 0.9;
        }

        ctx.fillStyle = isAngry ? "#200" : "#050510";
        ctx.fillRect(-50,-50, canvas.width+100, canvas.height+100);

        if(frame % 400 === 0) {
            let p = petD[Math.floor(Math.random()*petD.length)];
            helpers.push({ x: 50+Math.random()*(canvas.width-100), y: 50+Math.random()*(canvas.height-100), name: p.name, type: p.type, dmg: p.dmg, t: 0 });
        }
        helpers.forEach((h, hi) => {
            h.t += 0.1;
            ctx.strokeStyle = "#00d2ff"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(h.x, h.y, 25+Math.sin(h.t)*3, 0, Math.PI*2); ctx.stroke();
            drawPet(h.name, h.x, h.y, 40);
            if(Math.hypot(h.x-player.x, h.y-player.y) < 45) {
                if(!activeP.find(a => a.type === h.type)) activeP.push({type: h.type, dmg: h.dmg});
                helpers.splice(hi, 1);
                score += 50; document.getElementById('score-txt').innerText = "SKOR: " + score;
            }
        });

        drawPet(petD[selectedIdx].name, player.x, player.y, 50);

        const spBonus = 1 - (gameData.spL * 0.05);
        activeP.forEach(p => {
            let t = p.type;
            let fr = Math.floor(25 * spBonus);
            if(t === "rapid") fr = Math.max(2, Math.floor(4 * spBonus));
            
            if(frame % fr === 0) {
                const directions = (t==="rapid" || t==="spread" || t==="horn" || t==="jump" || t==="pierce") ? [1, -1] : [1];
                directions.forEach(dir => {
                    let vy = -10 * dir;
                    if(t === "cross") [[0,-8],[0,8],[8,0],[-8,0]].forEach(v => bullets.push({x:player.x,y:player.y,vx:v[0],vy:v[1],r:4,t,dmg:p.dmg,l:180}));
                    if(t === "pierce") bullets.push({x:player.x,y:player.y,vx:0,vy:vy,r:15,t,dmg:p.dmg,l:180});
                    if(t === "rapid") bullets.push({x:player.x,y:player.y,vx:(Math.random()-0.5)*8,vy:vy*1.2,r:3,t,dmg:p.dmg,l:150});
                    if(t === "spread") for(let i=-1; i<=1; i++) bullets.push({x:player.x,y:player.y,vx:i*4,vy:vy,r:4,t,dmg:p.dmg,l:180});
                    if(t === "xshot") [[-7,-7],[7,-7],[-7,7],[7,7]].forEach(v => bullets.push({x:player.x,y:player.y,vx:v[0],vy:v[1],r:5,t,dmg:p.dmg,l:180}));
                    if(t === "horn") for(let i=-2; i<=2; i++) bullets.push({x:player.x,y:player.y,vx:i*3,vy:vy*0.8,r:5,t,dmg:p.dmg,l:150});
                    if(t === "jump") bullets.push({x:player.x,y:player.y,vx:(Math.random()-0.5)*15,vy:vy,r:6,t:"jump",dmg:p.dmg,l:120});
                });
                if(t === "star") for(let a=0; a<Math.PI*2; a+=Math.PI/4) bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*7,vy:Math.sin(a)*7,r:4,t,dmg:p.dmg,l:140});
                if(t === "boomerang") bullets.push({x:player.x,y:player.y,vx:(Math.random()-0.5)*10,vy:-8,r:6,t:"bm",dmg:p.dmg,l:220});
            }
        });

        bullets.forEach((b, bi) => {
            if(b.t === "bm") { b.vx += (player.x-b.x)*0.035; b.vy += (player.y-b.y)*0.035; }
            if(b.t === "jump") { b.vx *= 0.95; }
            b.x += b.vx; b.y += b.vy;
            ctx.fillStyle = b.t === "xshot" ? "#f0f" : (b.t === "rapid" ? "#0f0" : "#00d2ff");
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
            if(b.l-- < 0 || b.x < -100 || b.x > canvas.width+100 || b.y < -100 || b.y > canvas.height+100) bullets.splice(bi, 1);
        });

        if(frame % 20 === 0) {
            let side = Math.floor(Math.random()*4);
            let x = side==0?Math.random()*canvas.width:(side==1?canvas.width+20:(side==2?Math.random()*canvas.width:-20));
            let y = side==0?-20:(side==1?Math.random()*canvas.height:(side==2?canvas.height+20:Math.random()*canvas.height));
            let type = "orange", hpE = 1;
            if(score > 4000) { type = "boss"; hpE = 30; }
            else if(score > 2500) { type = "red"; hpE = 6; }
            else if(score > 1500) { type = "green"; hpE = 3; }
            else if(score > 700) { type = "yellow"; hpE = 2; }
            enemies.push({x,y,r: type === "boss" ? 45 : 16, hp: hpE, maxHp: hpE, type, speed: 2.2 + Math.min(2, score/5000)});
        }

        enemies.forEach((e, ei) => {
            let a = Math.atan2(player.y-e.y, player.x-e.x);
            e.x += Math.cos(a)*e.speed; e.y += Math.sin(a)*e.speed;
            const colors = {orange: "#ff6600", yellow: "#ffff00", green: "#00ff00", red: "#ff0000", boss: "#ff0055"};
            ctx.fillStyle = colors[e.type];
            ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
            if(e.hp > 1) {
                ctx.fillStyle = "#333"; ctx.fillRect(e.x-15, e.y-e.r-10, 30, 5);
                ctx.fillStyle = "#f00"; ctx.fillRect(e.x-15, e.y-e.r-10, (e.hp/e.maxHp)*30, 5);
            }
            bullets.forEach((b, bi) => {
                if(Math.hypot(e.x-b.x, e.y-b.y) < e.r + b.r) {
                    e.hp -= b.dmg;
                    if(b.t !== "pierce" && b.t !== "bm") bullets.splice(bi, 1);
                    if(e.hp <= 0) {
                        enemies.splice(ei, 1);
                        score += e.type === "boss" ? 1000 : 10;
                        document.getElementById('score-txt').innerText = "SKOR: " + score;
                    }
                }
            });
            if(Math.hypot(e.x-player.x, e.y-player.y) < e.r + 15 && !isAngry) {
                enemies.splice(ei, 1); hp--; shake = 10;
                document.getElementById('hp-txt').innerText = "CAN: " + hp;
                if(hp <= 0) { gameData.stars += Math.floor(score/10); save(); location.reload(); }
            }
        });

        requestAnimationFrame(loop);
    }

    const move = (cx, cy) => { player.x = cx; player.y = cy; };
    window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => { e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
    refresh();
</script>
</body>

                directions.forEach(dir => {
                    let vy = -10 * dir;
                    if(t === "cross") [[0,-8],[0,8],[8,0],[-8,0]].forEach(v => bullets.push({x:player.x,y:player.y,vx:v[0],vy:v[1],r:4,t,dmg:p.dmg,l:180}));
                    if(t === "pierce") bullets.push({x:player.x,y:player.y,vx:0,vy:vy,r:15,t,dmg:p.dmg,l:180});
                    if(t === "rapid") bullets.push({x:player.x,y:player.y,vx:(Math.random()-0.5)*8,vy:vy*1.2,r:3,t,dmg:p.dmg,l:150});
                    if(t === "spread") for(let i=-1; i<=1; i++) bullets.push({x:player.x,y:player.y,vx:i*4,vy:vy,r:4,t,dmg:p.dmg,l:180});
                    if(t === "xshot") [[-7,-7],[7,-7],[-7,7],[7,7]].forEach(v => bullets.push({x:player.x,y:player.y,vx:v[0],vy:v[1],r:5,t,dmg:p.dmg,l:180}));
                    if(t === "horn") for(let i=-2; i<=2; i++) bullets.push({x:player.x,y:player.y,vx:i*3,vy:vy*0.8,r:5,t,dmg:p.dmg,l:150});
                    if(t === "jump") bullets.push({x:player.x,y:player.y,vx:(Math.random()-0.5)*15,vy:vy,r:6,t:"jump",dmg:p.dmg,l:120});
                });
                if(t === "star") for(let a=0; a<Math.PI*2; a+=Math.PI/4) bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*7,vy:Math.sin(a)*7,r:4,t,dmg:p.dmg,l:140});
                if(t === "boomerang") bullets.push({x:player.x,y:player.y,vx:(Math.random()-0.5)*10,vy:-8,r:6,t:"bm",dmg:p.dmg,l:220});
            }
        });

        bullets.forEach((b, bi) => {
            if(b.t === "bm") { b.vx += (player.x-b.x)*0.035; b.vy += (player.y-b.y)*0.035; }
            if(b.t === "jump") { b.vx *= 0.95; }
            b.x += b.vx; b.y += b.vy;
            ctx.fillStyle = b.t === "xshot" ? "#f0f" : (b.t === "rapid" ? "#0f0" : "#00d2ff");
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
            if(b.l-- < 0 || b.x < -100 || b.x > canvas.width+100 || b.y < -100 || b.y > canvas.height+100) bullets.splice(bi, 1);
        });

        if(frame % 20 === 0) {
            let side = Math.floor(Math.random()*4);
            let x = side==0?Math.random()*canvas.width:(side==1?canvas.width+20:(side==2?Math.random()*canvas.width:-20));
            let y = side==0?-20:(side==1?Math.random()*canvas.height:(side==2?canvas.height+20:Math.random()*canvas.height));
            let type = "orange", hpE = 1;
            if(score > 4000) { type = "boss"; hpE = 30; }
            else if(score > 2500) { type = "red"; hpE = 6; }
            else if(score > 1500) { type = "green"; hpE = 3; }
            else if(score > 700) { type = "yellow"; hpE = 2; }
            enemies.push({x,y,r: type === "boss" ? 45 : 16, hp: hpE, maxHp: hpE, type, speed: 2.2 + Math.min(2, score/5000)});
        }

        enemies.forEach((e, ei) => {
            let a = Math.atan2(player.y-e.y, player.x-e.x);
            e.x += Math.cos(a)*e.speed; e.y += Math.sin(a)*e.speed;
            const colors = {orange: "#ff6600", yellow: "#ffff00", green: "#00ff00", red: "#ff0000", boss: "#ff0055"};
            ctx.fillStyle = colors[e.type];
            ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
            if(e.hp > 1) {
                ctx.fillStyle = "#333"; ctx.fillRect(e.x-15, e.y-e.r-10, 30, 5);
                ctx.fillStyle = "#f00"; ctx.fillRect(e.x-15, e.y-e.r-10, (e.hp/e.maxHp)*30, 5);
            }
            bullets.forEach((b, bi) => {
                if(Math.hypot(e.x-b.x, e.y-b.y) < e.r + b.r) {
                    e.hp -= b.dmg;
                    if(b.t !== "pierce" && b.t !== "bm") bullets.splice(bi, 1);
                    if(e.hp <= 0) {
                        enemies.splice(ei, 1);
                        score += e.type === "boss" ? 1000 : 10;
                        document.getElementById('score-txt').innerText = "SKOR: " + score;
                    }
                }
            });
            if(Math.hypot(e.x-player.x, e.y-player.y) < e.r + 15 && !isAngry) {
                enemies.splice(ei, 1); hp--; shake = 10;
                document.getElementById('hp-txt').innerText = "CAN: " + hp;
                if(hp <= 0) { gameData.stars += Math.floor(score/10); save(); location.reload(); }
            }
        });

        requestAnimationFrame(loop);
    }

    const move = (cx, cy) => { player.x = cx; player.y = cy; };
    window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => { e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
    refresh();
</script>
</body>
</html>
