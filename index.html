<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Food Gang: WebP Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #111; overflow: hidden; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; user-select: none; }
        canvas { display: none; background: linear-gradient(to bottom, #1a1c2e, #0f101b); }
        
        #menu { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f101b; z-index: 100; padding: 20px; }
        .title { font-size: 36px; color: #ff0055; text-shadow: 0 0 15px #ff0055; font-weight: bold; margin-bottom: 20px; text-align: center; }
        
        .pet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; max-width: 420px; }
        .pet-card { border: 3px solid #222; border-radius: 15px; padding: 10px; text-align: center; width: 120px; background: #1c1d30; cursor: pointer; transition: transform 0.2s; }
        .pet-card.selected { border-color: #00d2ff; background: #24354d; transform: scale(1.05); box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }
        .pet-card img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; }
        .pet-card p { font-size: 12px; font-weight: bold; color: #fff; }
        .pet-card span { font-size: 9px; color: #aaa; display: block; margin-top: 3px; }
        
        #btn-start { padding: 15px 60px; font-size: 24px; background: #ff0055; border: none; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4); }
        
        #hud { position: absolute; top: 10px; width: 100%; display: none; justify-content: space-between; padding: 0 20px; pointer-events: none; z-index: 10; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        
        /* MOBİL DOKUNMATİK BUTONLAR - Gecikmesiz touch-action */
        #mobile-controls { display: none; position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; touch-action: none; }
        .touch-btn { pointer-events: auto; position: absolute; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 24px; user-select: none; -webkit-user-select: none; touch-action: none; }
        .touch-btn:active { background: rgba(0, 210, 255, 0.4); border-color: #00d2ff; transform: scale(0.92); }
        
        #btn-left { bottom: 30px; left: 30px; width: 70px; height: 70px; }
        #btn-right { bottom: 30px; left: 120px; width: 70px; height: 70px; }
        #btn-jump { bottom: 110px; right: 40px; width: 70px; height: 70px; font-size: 18px; background: rgba(255, 0, 85, 0.2); border-color: rgba(255,0,85,0.4); }
        #btn-shoot { bottom: 25px; right: 120px; width: 85px; height: 85px; font-size: 16px; background: rgba(0, 210, 255, 0.2); border-color: rgba(0,210,255,0.4); }
        #btn-flip-spec { display: none; bottom: 25px; right: 120px; width: 85px; height: 85px; font-size: 13px; text-align: center; background: rgba(255, 170, 0, 0.3); border-color: #ffaa00; color: #ffaa00; line-height: 1.2; }

        #orientation-warning {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f101b; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
        }
        #orientation-warning .icon { font-size: 64px; margin-bottom: 20px; animation: rotateDevice 2s infinite ease-in-out; }
        #orientation-warning .text { font-size: 22px; font-weight: bold; color: #00d2ff; }

        @keyframes rotateDevice {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }

        @media orientation: portrait {
            #orientation-warning { display: flex; }
            #menu, #hud, canvas, #mobile-controls { display: none !important; }
        }
    </style>
</head>
<body>

<div id="orientation-warning">
    <div class="icon">🔄📱</div>
    <div class="text">LÜTFEN CİHAZINIZI YATAY DÖNDÜRÜN</div>
</div>

<div id="menu">
    <div class="title">FOOD GANG<br><span style="font-size: 18px; color: #00d2ff;">WEB-READY EDITION</span></div>
    <div id="pet-grid" class="pet-grid"></div>
    <button id="btn-start">SAVAŞI BAŞLAT</button>
</div>

<div id="hud">
    <div id="score-txt">SKOR: 0</div>
    <div id="hp-txt">CAN: ❤️❤️❤️</div>
</div>

<div id="mobile-controls">
    <div id="btn-left" class="touch-btn">◀</div>
    <div id="btn-right" class="touch-btn">▶</div>
    <div id="btn-jump" class="touch-btn">ZIPLA</div>
    <div id="btn-shoot" class="touch-btn">ATEŞ</div>
    <div id="btn-flip-spec" class="touch-btn">DAİREYİ<br>BÜYÜT</div>
</div>

<canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Resim adresi eşleştirmesi (Dosya adı kurallarına tam uyumlu)
    const foodCharacters = [
        { id: "squeak", name: "Squeak", file: "squeak.webp", type: "cross", dmg: 1, desc: "Alt Hariç 3 Yön", img: null },
        { id: "gus", name: "Gus", file: "gus.webp", type: "pierce", dmg: 2, desc: "Sağ ve Sola Delici", img: null },
        { id: "blinky", name: "Blinky", file: "blinky.webp", type: "star", dmg: 1, desc: "Altsız 5 Yön Yıldız", img: null },
        { id: "dot", name: "Dot", file: "dot.webp", type: "rapid", dmg: 1, desc: "Sağ-Sol Seri Atış", img: null },
        { id: "sugar", name: "Sugar", file: "sugar.webp", type: "spread", dmg: 1, desc: "Sağ-Sol 3'lü Yelpaze", img: null },
        { id: "flip", name: "Flip", file: "flip.webp", type: "boomerang", dmg: 1, desc: "Dönen Bumerang Çemberi", img: null },
        { id: "yeyet", name: "Yeyet", file: "yeyet.webp", type: "xshot", dmg: 1, desc: "Dar Açılı Çapraz", img: null },
        { id: "moosey", name: "Moosey", file: "moosey.webp", type: "horn", dmg: 1, desc: "Sadece Tam Önüne", img: null },
        { id: "blook", name: "Blook", file: "blook.webp", type: "jump", dmg: 1, desc: "Sağ-Sol Sıçrayan", img: null }
    ];

    let selectedIdx = 0;
    let score = 0, hp = 3, running = false, frame = 0;
    let player, platforms = [], bullets = [], enemies = [];
    const gravity = 0.4;
    
    const keys = { w: false, a: false, d: false, e: false, shootBtnPressed: false };
    let lastFacing = 1; 

    // Ateş gecikmesini önlemek için Zaman Sayacı
    let lastShotTime = 0;

    let flipOrbitRadius = 40; 
    let flipAngleOffset = 0;

    // Resimleri Önceden Yükleme (Preload) Döngüsü
    foodCharacters.forEach((food, i) => {
        food.img = new Image();
        food.img.src = food.file; // Klasördeki "squeak.webp" gibi dosyaları çeker
        
        const card = document.createElement('div');
        card.className = `pet-card ${i === 0 ? 'selected' : ''}`;
        card.innerHTML = `<img src="${food.file}" alt="${food.name}" onerror="this.style.display='none';"><p>${food.name}</p><span>${food.desc}</span>`;
        card.onclick = () => {
            document.querySelectorAll('.pet-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedIdx = i;
        };
        grid = document.getElementById('pet-grid').appendChild(card);
    });

    document.getElementById('btn-start').onclick = () => {
        if (window.innerHeight > window.innerWidth) return;

        document.getElementById('menu').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('mobile-controls').style.display = 'block';
        canvas.style.display = 'block';
        
        if(foodCharacters[selectedIdx].type === "boomerang") {
            document.getElementById('btn-shoot').style.display = 'none';
            document.getElementById('btn-flip-spec').style.display = 'flex';
        } else {
            document.getElementById('btn-shoot').style.display = 'flex';
            document.getElementById('btn-flip-spec').style.display = 'none';
        }
        
        resizeCanvas();
        initGame();
        running = true;
        loop();
    };

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function initGame() {
        player = {
            x: canvas.width / 2, y: canvas.height - 150,
            vx: 0, vy: 0, width: 45, height: 45, speed: 5, jumpForce: 11,
            grounded: false, character: foodCharacters[selectedIdx]
        };
        hp = 3; score = 0; bullets = []; enemies = [];
        updateHUD();

        platforms = [
            { x: 0, y: canvas.height - 40, width: canvas.width, height: 40 },
            { x: canvas.width * 0.1, y: canvas.height * 0.68, width: canvas.width * 0.25, height: 15 },
            { x: canvas.width * 0.65, y: canvas.height * 0.68, width: canvas.width * 0.25, height: 15 },
            { x: canvas.width * 0.32, y: canvas.height * 0.45, width: canvas.width * 0.36, height: 15 },
            { x: canvas.width * 0.12, y: canvas.height * 0.22, width: canvas.width * 0.2, height: 15 },
            { x: canvas.width * 0.68, y: canvas.height * 0.22, width: canvas.width * 0.2, height: 15 }
        ];
    }

    function updateHUD() {
        document.getElementById('score-txt').innerText = "SKOR: " + score;
        document.getElementById('hp-txt').innerText = "CAN: " + "❤️".repeat(Math.max(0, hp));
    }

    function playerShoot() {
        const char = player.character;
        const side = lastFacing; 
        
        if (char.type === "boomerang") return;

        // Ateş edildiğinde gecikmesiz zaman damgası yenileme
        lastShotTime = performance.now();

        if (char.type === "cross") {
            [[0,-8],[8,0],[-8,0]].forEach(v => {
                bullets.push({ x: player.x, y: player.y, vx: v[0], vy: v[1], r: 5, type: char.type, dmg: char.dmg, l: 50 });
            });
        } 
        else if (char.type === "pierce") {
            bullets.push({ x: player.x, y: player.y, vx: side * 11, vy: 0, r: 16, type: char.type, dmg: char.dmg, l: 80 });
        } 
        else if (char.type === "star") {
            const allowedAngles = [0, Math.PI, -Math.PI/4, -Math.PI/2, -3*Math.PI/4];
            allowedAngles.forEach(a => {
                bullets.push({ x: player.x, y: player.y, vx: Math.cos(a) * 7, vy: Math.sin(a) * 7, r: 5, type: char.type, dmg: char.dmg, l: 50 });
            });
        } 
        else if (char.type === "rapid") {
            bullets.push({ x: player.x, y: player.y, vx: side * 14, vy: (Math.random()-0.5)*2, r: 4, type: char.type, dmg: char.dmg, l: 40 });
        } 
        else if (char.type === "spread") {
            for (let i = -1; i <= 1; i++) {
                bullets.push({ x: player.x, y: player.y, vx: side * 10, vy: i * 2.5, r: 5, type: char.type, dmg: char.dmg, l: 50 });
            }
        } 
        else if (char.type === "xshot") {
            bullets.push({ x: player.x, y: player.y, vx: side * 9, vy: -3, r: 5, type: char.type, dmg: char.dmg, l: 60 });
            bullets.push({ x: player.x, y: player.y, vx: side * 9, vy: 3, r: 5, type: char.type, dmg: char.dmg, l: 60 });
        } 
        else if (char.type === "horn") {
            for (let i = -2; i <= 2; i++) {
                bullets.push({ x: player.x, y: player.y, vx: side * (10 - Math.abs(i)), vy: i * 2, r: 5, type: char.type, dmg: char.dmg, l: 45 });
            }
        } 
        else if (char.type === "jump") {
            bullets.push({ x: player.x, y: player.y, vx: side * 12, vy: -2, r: 6, type: "jump", dmg: char.dmg, l: 50 });
        }
    }

    function loop() {
        if (window.innerHeight > window.innerWidth) {
            requestAnimationFrame(loop);
            return;
        }

        if (!running) return;
        frame++;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (keys.a) { player.vx = -player.speed; lastFacing = -1; }
        else if (keys.d) { player.vx = player.speed; lastFacing = 1; }
        else { player.vx *= 0.8; }

        if (keys.w && player.grounded) { player.vy = -player.jumpForce; player.grounded = false; }

        player.vy += gravity; player.x += player.vx; player.y += player.vy;

        // Ekran kenarları kontrolü (Genişliğe göre koruma)
        if (player.x < player.width/2) player.x = player.width/2;
        if (player.x > canvas.width - player.width/2) player.x = canvas.width - player.width/2;

        player.grounded = false;
        platforms.forEach(p => {
            if (player.x + player.width/2 > p.x && player.x - player.width/2 < p.x + p.width && 
                player.y + player.height/2 >= p.y && player.y - player.height/2 < p.y + p.height && player.vy > 0) {
                player.y = p.y - player.height/2; player.vy = 0; player.grounded = true;
            }
        });

        if (player.y > canvas.height) {
            hp--; player.x = canvas.width / 2; player.y = 100; player.vy = 0;
            updateHUD(); if (hp <= 0) gameOver();
        }

        // GECİKMESİZ SİSTEM: Milisaniye tabanlı ateş kontrolü
        let now = performance.now();
        let currentCooldown = player.character.type === "rapid" ? 100 : 380; // Rapid için 100ms, diğerleri için 380ms ara
        if (keys.shootBtnPressed && (now - lastShotTime >= currentCooldown)) {
            playerShoot();
        }

        // Platformları Çiz
        ctx.fillStyle = "#2a2d4a";
        platforms.forEach(p => {
            ctx.beginPath(); ctx.roundRect(p.x, p.y, p.width, p.height, 5); ctx.fill();
            ctx.fillStyle = "#00d2ff"; ctx.fillRect(p.x, p.y, p.width, 3);
            ctx.fillStyle = "#2a2d4a";
        });

        // --- RESİM TABANLI KARAKTER ÇİZİMİ ---
        if (player.character.img && player.character.img.complete) {
            ctx.save();
            ctx.translate(player.x, player.y);
            // Karakterin yürüdüğü yöne doğru dönmesini (Flip) sağlar
            if (lastFacing === -1) ctx.scale(-1, 1); 
            ctx.drawImage(player.character.img, -player.width/2, -player.height/2, player.width, player.height);
            ctx.restore();
        } else {
            // WebP resimleri yüklenene kadar yedek geçici kutu çiz
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(player.x - player.width/2, player.y - player.height/2, player.width, player.height);
        }

        // Flip Özel Döngüsü
        if (player.character.type === "boomerang") {
            flipAngleOffset += 0.05;
            if (keys.e) { if (flipOrbitRadius < 130) flipOrbitRadius += 2.5; } 
            else { if (flipOrbitRadius > 45) flipOrbitRadius -= 3.5; }

            const bulletCount = 6;
            bullets = []; 
            
            for(let i = 0; i < bulletCount; i++) {
                let angle = (i * (Math.PI * 2 / bulletCount)) + flipAngleOffset;
                let bx = player.x + (lastFacing * 15) + Math.cos(angle) * flipOrbitRadius;
                let by = player.y + Math.sin(angle) * flipOrbitRadius;

                bullets.push({ x: bx, y: by, vx: 0, vy: 0, r: 6, type: "flip-orbit", dmg: player.character.dmg, l: 2 });

                ctx.fillStyle = "#ffaa00";
                ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI * 2); ctx.fill();
            }
        }

        bullets.forEach((b, bi) => {
            if (b.type === "flip-orbit") return;
            if (b.type === "jump") { b.vx *= 0.96; } 
            
            b.x += b.vx; b.y += b.vy;

            ctx.fillStyle = b.type === "pierce" ? "#ff0055" : (b.type === "rapid" ? "#00ffcc" : "#ffff00");
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();

            if (b.l-- < 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                bullets.splice(bi, 1);
            }
        });

        // Düşmanlar
        if (frame % 80 === 0 && enemies.length < 5) {
            let spawnSide = Math.random() > 0.5 ? 50 : canvas.width - 50;
            let enemyEmojis = ["🍟", "🍔", "🍕", "🍿"];
            enemies.push({
                x: spawnSide, y: 50, vx: 0, vy: 0, radius: 18,
                emoji: enemyEmojis[Math.floor(Math.random() * enemyEmojis.length)],
                hp: 3, speed: 1.5 + Math.random() * 1.5
            });
        }

        enemies.forEach((e, ei) => {
            if (e.x < player.x) e.vx = e.speed; else e.vx = -e.speed;
            e.vy += gravity; e.x += e.vx; e.y += e.vy;

            let eGrounded = false;
            platforms.forEach(p => {
                if (e.x + e.radius > p.x && e.x - e.radius < p.x + p.width && 
                    e.y + e.radius >= p.y && e.y - e.radius < p.y + p.height && e.vy > 0) {
                    e.y = p.y - e.radius; e.vy = 0; eGrounded = true;
                }
            });

            if (eGrounded && player.y < e.y - 50 && Math.random() < 0.02) e.vy = -10;
            if (e.y > canvas.height) { enemies.splice(ei, 1); return; }

            ctx.font = "30px Arial"; ctx.fillText(e.emoji, e.x, e.y);

            ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(e.x - 15, e.y - e.radius - 12, 30, 4);
            ctx.fillStyle = "#ff0055"; ctx.fillRect(e.x - 15, e.y - e.radius - 12, (e.hp / 3) * 30, 4);

            if (Math.hypot(e.x - player.x, e.y - player.y) < e.radius + player.width/2) {
                enemies.splice(ei, 1); hp--; updateHUD();
                if (hp <= 0) gameOver();
            }

            bullets.forEach((b, bi) => {
                if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + b.r) {
                    e.hp -= b.dmg;
                    if (b.type !== "pierce" && b.type !== "flip-orbit") bullets.splice(bi, 1);
                    if (e.hp <= 0) { enemies.splice(ei, 1); score += 100; updateHUD(); }
                }
            });
        });

        requestAnimationFrame(loop);
    }

    function gameOver() {
        running = false;
        alert("Oyun Bitti! Skorun: " + score);
        location.reload();
    }

    // --- PC Girişleri ---
    window.addEventListener('keydown', e => {
        if(e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = true;
        if(e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = true;
        if(e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = true;
        if(e.key === 'e' || e.key === 'E') keys.e = true;
        if(e.key === ' ') {
            if(!keys.shootBtnPressed) playerShoot(); // İlk basışta anında tetikle
            keys.shootBtnPressed = true;
        }
    });

    window.addEventListener('keyup', e => {
        if(e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = false;
        if(e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = false;
        if(e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = false;
        if(e.key === 'e' || e.key === 'E') keys.e = false;
        if(e.key === ' ') keys.shootBtnPressed = false;
    });

    // --- MOBİL ANINDA TETİKLEME LİSTENER'LARI ---
    const attachInstantTouch = (id, callbackPress, callbackRelease) => {
        const btn = document.getElementById(id);
        // Gecikmesiz dokunma başlangıcı (touchstart)
        btn.addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            callbackPress(); 
        }, { passive: false });
        
        // Dokunma bitişi
        btn.addEventListener('touchend', (e) => { 
            e.preventDefault(); 
            callbackRelease(); 
        }, { passive: false });
    };

    attachInstantTouch('btn-left',  () => keys.a = true,  () => keys.a = false);
    attachInstantTouch('btn-right', () => keys.d = true,  () => keys.d = false);
    attachInstantTouch('btn-jump',  () => keys.w = true,  () => keys.w = false);
    
    // Ateş butonuna basıldığı an ilk mermiyi sıfır gecikmeyle fırlatır
    attachInstantTouch('btn-shoot', () => { 
        playerShoot(); 
        keys.shootBtnPressed = true; 
    }, () => keys.shootBtnPressed = false);
    
    attachInstantTouch('btn-flip-spec', () => keys.e = true, () => keys.e = false);

    window.addEventListener('resize', resizeCanvas);
</script>
</body>
</html>
