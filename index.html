<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Pets: Multiplayer Arena V3 - New Squad</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body { background-color: #064e3b; font-family: 'Arial', sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; color: white; }
        #setupMenu, #lobbyMenu { position: absolute; width: 90%; max-width: 500px; background: rgba(6, 78, 59, 0.95); border: 4px solid #10b981; border-radius: 16px; padding: 20px; z-index: 2000; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.7); }
        h2, h3 { margin-bottom: 15px; color: #34d399; text-shadow: 2px 2px #047857; }
        input[type="text"] { width: 80%; padding: 10px; border-radius: 8px; border: 2px solid #10b981; background: #022c22; color: white; font-size: 16px; text-align: center; margin-bottom: 15px; }
        .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .char-card { background: #047857; border: 2px solid #065f46; border-radius: 8px; padding: 8px; cursor: pointer; font-size: 12px; }
        .char-card.selected { border-color: #34d399; background: #10b981; box-shadow: 0 0 10px #34d399; }
        .char-card.locked { opacity: 0.4; background: #1f2937; border-color: #4b5563; }
        .shop-box { background: #111827; border: 2px dashed #f59e0b; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; }
        .btn { background: #10b981; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px #047857; text-transform: uppercase; margin: 5px; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        #gameContainer { position: relative; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; background: #022c22; }
        canvas { background: linear-gradient(to bottom, #064e3b, #022c22); display: block; z-index: 1; }
        #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; background: rgba(2, 44, 34, 0.85); padding: 10px; border-radius: 8px; border: 2px solid #10b981; z-index: 1000; font-size: 13px; }
    </style>
</head>
<body>

<div id="setupMenu">
    <h2>THE PETS: ARENA V3</h2>
    <input type="text" id="usernameInp" placeholder="İsmini Yaz..." maxLength="12" value="Oyuncu">
    
    <h3>Ana 9'lu Karakter Seçimi</h3>
    <div class="char-grid" id="charGrid"></div>

    <div class="shop-box" id="dailyShop">
        <strong>📆 GÜNLÜK DÜKKAN TEKLİFİ:</strong> <span id="shopOfferText">Yükleniyor...</span>
    </div>

    <h3>Oyun Modu Seç</h3>
    <button class="btn" onclick="selectMode(2)">2 Kişilik</button>
    <button class="btn" onclick="selectMode(3)">3 Kişilik</button>
    <button class="btn" onclick="selectMode(4)">4 Kişilik</button>
</div>

<div id="lobbyMenu" style="display:none;">
    <h2 id="lobbyStatus">DİĞER OYUNCULAR BEKLENİYOR...</h2>
    <div id="lobbyCount" style="font-size: 24px; margin: 15px 0; font-weight: bold; color: #34d399;">1 / 2</div>
    <p style="font-size: 12px; color:#a7f3d0;">Oda dolduğunda yeşillik arenasına otomatik ışınlanacaksınız!</p>
</div>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div id="hud">
        <div>Mod: <span id="hudMode" style="color:#34d399;">Yükleniyor</span></div>
        <div>Karakter: <span id="hudChar" style="color:#f59e0b;">-</span></div>
        <div>X: <span id="xPos">0</span> | Y: <span id="yPos">0</span></div>
    </div>
</div>

<script>
// --- FIREBASE KURULUMU ---
const firebaseConfig = { databaseURL: "https://tomoyunu-5cd2f-default-rtdb.europe-west1.firebasedatabase.app/" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// GÜNCELLENEN YENİ ANA 9'LU VE ÖZEL GÜÇLERİ
const CHARACTERS = {
    Moosey: { speed: 5.0, jump: -11.5, dashCd: 40, dashPower: 15, wallSlide: 0.25, gravMult: 1.0, color: "#10b981", desc: "Dengeli Geyik Hızı" },
    Sugar:  { speed: 4.8, jump: -13.0, dashCd: 45, dashPower: 14, wallSlide: 0.25, gravMult: 1.0, color: "#f43f5e", desc: "Yüksek Pop Zıplaması" },
    Squeak: { speed: 4.9, jump: -11.0, dashCd: 42, dashPower: 14, wallSlide: 0.08, gravMult: 1.0, color: "#38bdf8", desc: "Yapışkan Jöle Tutuşu" },
    Gus:    { speed: 4.5, jump: -11.2, dashCd: 55, dashPower: 22, wallSlide: 0.35, gravMult: 1.0, color: "#eab308", desc: "Devasa İleri Dash" },
    Dot:    { speed: 5.5, jump: -10.8, dashCd: 38, dashPower: 15, wallSlide: 0.22, gravMult: 1.0, color: "#a855f7", desc: "Ultra Seri Koşucu" },
    Flip:   { speed: 5.1, jump: -11.4, dashCd: 40, dashPower: 16, wallSlide: 0.20, gravMult: 1.0, color: "#f97316", desc: "Akrobatik Duvar İtişi" },
    Yeyet:  { speed: 4.7, jump: -11.0, dashCd: 25, dashPower: 13, wallSlide: 0.28, gravMult: 1.0, color: "#ec4899", desc: "Ardı Ardına Hızlı Dash" },
    Blook:  { speed: 5.2, jump: -11.2, dashCd: 40, dashPower: 15, wallSlide: 0.24, gravMult: 1.0, color: "#8b5cf6", desc: "Keskin Çikolata Dönüşü" },
    Blinky: { speed: 4.8, jump: -11.6, dashCd: 45, dashPower: 14, wallSlide: 0.20, gravMult: 0.8, color: "#14b8a6", desc: "Hafif Yerçekimi Süzülmesi" }
};

let selectedChar = "Moosey";
let myPlayerId = "p_" + Math.random().toString(36).substr(2, 9);
let currentRoomId = null;
let targetPlayersCount = 2;

// GÜNLÜK DÜKKAN TEKLİF SİSTEMİ (Her gün havuzdan rastgele 1 tanesi dükkanda listelenir)
const shopPool = ["Sugar", "Gus", "Flip", "Yeyet", "Blook", "Blinky"];
const dayOfYear = Math.floor(new Date() / 86400000);
const dailyShopChar = shopPool[dayOfYear % shopPool.length];

// Menü Arayüzünü Yeni Karakterlere Göre Çiz
const charGrid = document.getElementById("charGrid");
Object.keys(CHARACTERS).forEach((name, idx) => {
    const card = document.createElement("div");
    card.className = "char-card" + (name === selectedChar ? " selected" : "");
    
    // İlk 3 karakter (Moosey, Sugar, Squeak) başlangıçta açık, diğerleri kilitli (günlük teklif hariç)
    let isLocked = idx >= 3 && name !== dailyShopChar;
    if (isLocked) card.classList.add("locked");
    
    card.innerHTML = `<strong>${name}</strong><br><span style="font-size:9px;color:#a7f3d0;">${CHARACTERS[name].desc}</span>`;
    card.onclick = () => {
        if (isLocked) { alert(`${name} şuan kilitli! Yarınki dükkan teklifinde gelebilir veya dükkandan açılabilir.`); return; }
        document.querySelectorAll(".char-card").forEach(c => c.classList.remove("selected"));
        card.classList.add("selected");
        selectedChar = name;
    };
    charGrid.appendChild(card);
});
document.getElementById("shopOfferText").innerText = `${dailyShopChar.toUpperCase()} BUGÜNE ÖZEL TEKLİFLE KİLİTSİZ VE SEÇİLEBİLİR!`;

// --- OYUN MOTORU AYARLARI ---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const WORLD = { width: 4000, height: 600 };
const camera = { x: 0, y: 0, width: canvas.width, height: canvas.height };

const player = {
    x: 100, y: 300, w: 34, h: 34, velX: 0, velY: 0,
    grounded: false, jumping: false, facing: "right",
    dashTimer: 0, dashCooldown: 0, isDashing: false,
    onWall: false, wallDir: null
};

const gravity = 0.48;
const friction = 0.80;
let keys = { left: false, right: false, jump: false, dash: false };
let otherPlayers = {};
let platforms = [];

// 150 Level Mantığından Türetilen Zorlu Kesitler (Kedisiz)
const levelChunks = [
    [{ x: 300, y: 420, w: 60, h: 200 }, { x: 500, y: 300, w: 50, h: 300 }, { x: 700, y: 220, w: 60, h: 400 }],
    [{ x: 900, y: 480, w: 150, h: 120 }, { x: 1300, y: 440, w: 150, h: 160 }, { x: 1650, y: 380, w: 120, h: 220 }],
    [{ x: 1900, y: 500, w: 200, h: 100 }, { x: 2000, y: 380, w: 150, h: 30 }, { x: 1900, y: 260, w: 150, h: 30 }],
    [{ x: 2300, y: 150, w: 40, h: 450 }, { x: 2500, y: 320, w: 40, h: 280 }, { x: 2700, y: 200, w: 40, h: 400 }],
    [{ x: 2900, y: 450, w: 100, h: 150 }, { x: 3150, y: 380, w: 80, h: 220 }, { x: 3400, y: 500, w: 500, h: 100 }]
];

function generateRandomMap() {
    platforms = [{ x: 0, y: 520, w: 300, h: 80 }]; 
    let shuffled = [...levelChunks].sort(() => Math.random() - 0.5);
    let offset = 0;
    shuffled.forEach(chunk => {
        chunk.forEach(p => {
            platforms.push({ x: p.x + offset, y: p.y, width: p.w, height: p.h });
        });
    });
    platforms.push({ x: 3850, y: 100, width: 150, height: 500, isFinish: true });
}

// --- MULTIPLAYER KONTROLLERİ ---
function selectMode(count) {
    targetPlayersCount = count;
    document.getElementById("setupMenu").style.display = "none";
    document.getElementById("lobbyMenu").style.display = "block";
    joinRoom();
}

function joinRoom() {
    const name = document.getElementById("usernameInp").value || "Oyuncu";
    const lobbyRef = db.ref("arena_lobbies_" + targetPlayersCount);
    
    lobbyRef.once("value", snapshot => {
        let rooms = snapshot.val() || {};
        let foundRoom = null;

        for (let rId in rooms) {
            if (Object.keys(rooms[rId].players || {}).length < targetPlayersCount && !rooms[rId].started) {
                foundRoom = rId;
                break;
            }
        }

        if (!foundRoom) foundRoom = "room_" + Math.random().toString(36).substr(2, 9);
        currentRoomId = foundRoom;

        const myPlayerRef = db.ref(`arena_lobbies_${targetPlayersCount}/${currentRoomId}/players/${myPlayerId}`);
        myPlayerRef.set({
            name: name,
            char: selectedChar,
            x: 100, y: 300,
            facing: "right"
        });
        myPlayerRef.onDisconnect().remove();

        db.ref(`arena_lobbies_${targetPlayersCount}/${currentRoomId}`).on("value", roomSnap => {
            let roomData = roomSnap.val();
            if (!roomData) return;

            let pKeys = Object.keys(roomData.players || {});
            document.getElementById("lobbyCount").innerText = `${pKeys.length} / ${targetPlayersCount}`;

            if (pKeys.length >= targetPlayersCount && !roomData.started) {
                db.ref(`arena_lobbies_${targetPlayersCount}/${currentRoomId}/started`).set(true);
            }

            if (roomData.started) {
                db.ref(`arena_lobbies_${targetPlayersCount}/${currentRoomId}`).off();
                startTheGame();
            }
        });
    });
}

function startTheGame() {
    document.getElementById("lobbyMenu").style.display = "none";
    document.getElementById("gameContainer").style.display = "flex";
    
    document.getElementById("hudMode").innerText = `${targetPlayersCount}'li Arena`;
    document.getElementById("hudChar").innerText = selectedChar;

    generateRandomMap();
    resizeGame();

    db.ref(`arena_lobbies_${targetPlayersCount}/${currentRoomId}/players`).on("value", snap => {
        let allP = snap.val() || {};
        otherPlayers = {};
        for(let id in allP) {
            if(id !== myPlayerId) otherPlayers[id] = allP[id];
        }
    });

    setInterval(() => {
        db.ref(`arena_lobbies_${targetPlayersCount}/${currentRoomId}/players/${myPlayerId}`).update({
            x: player.x, y: player.y, facing: player.facing
        });
    }, 45);

    gameLoop();
}

// --- FİZİK GÜNCELLEMELERİ ---
window.addEventListener("keydown", (e) => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
    if (e.code === "ArrowUp" || e.code === "Space" || e.code === "KeyW") keys.jump = true;
    if (e.code === "ShiftLeft" || e.code === "ShiftRight") keys.dash = true;
});
window.addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
    if (e.code === "ArrowUp" || e.code === "Space" || e.code === "KeyW") keys.jump = false;
    if (e.code === "ShiftLeft" || e.code === "ShiftRight") keys.dash = false;
});

function update() {
    const stats = CHARACTERS[selectedChar];

    if (player.dashCooldown > 0) player.dashCooldown--;
    
    if (keys.dash && player.dashCooldown === 0 && !player.isDashing) {
        player.isDashing = true;
        player.dashTimer = 10;
        player.dashCooldown = stats.dashCd;
        player.velY = 0;
    }

    if (player.isDashing) {
        player.velX = player.facing === "right" ? stats.dashPower : -stats.dashPower;
        player.dashTimer--;
        if (player.dashTimer <= 0) player.isDashing = false;
    } else {
        if (keys.left) { player.velX -= 0.6; player.facing = "left"; }
        if (keys.right) { player.velX += 0.6; player.facing = "right"; }
    }

    player.velX *= friction;
    
    if (player.onWall && player.velY > 0) {
        player.velY += (gravity * stats.gravMult) * stats.wallSlide; 
    } else {
        player.velY += (gravity * stats.gravMult);
    }

    player.grounded = false; player.onWall = false;

    platforms.forEach(p => {
        let pX = p.x, pY = p.y, pW = p.width, pH = p.height;
        if (player.x < pX + pW && player.x + player.w > pX && player.y < pY + pH && player.y + player.h > pY) {
            if(p.isFinish) {
                alert("TEBRİKLER! Arenayı Birinci Bitirdin!");
                player.x = 100; player.y = 300;
                return;
            }
            let oX = (player.x + player.w/2 < pX + pW/2) ? (player.x + player.w) - pX : pX + pW - player.x;
            let oY = (player.y + player.h/2 < pY + pH/2) ? (player.y + player.h) - pY : pY + pH - player.y;

            if (oX >= oY) {
                if (player.y + player.h/2 > pY + pH/2) { player.y += oY; player.velY = 0; }
                else { player.grounded = true; player.jumping = false; player.y -= oY; player.velY = 0; }
            } else {
                if (player.x + player.w/2 > pX + pW/2) {
                    player.x += oX; player.velX = 0;
                    if(!player.grounded && keys.left) { player.onWall = true; player.wallDir = "left"; }
                } else {
                    player.x -= oX; player.velX = 0;
                    if(!player.grounded && keys.right) { player.onWall = true; player.wallDir = "right"; }
                }
            }
        }
    });

    if (keys.jump && !player.jumping) {
        if (player.grounded) { player.jumping = true; player.velY = stats.jump; }
        else if (player.onWall) {
            player.jumping = true; 
            player.velY = stats.jump * 0.9;
            // Flip duvar zıplamasında ekstra güç kazanır
            let pushForce = (selectedChar === "Flip") ? 10 : 7;
            player.velX = player.wallDir === "left" ? pushForce : -pushForce;
            player.facing = player.wallDir === "left" ? "right" : "left";
        }
    }

    player.x += player.velX; player.y += player.velY;
    if (player.x < 0) player.x = 0;
    if (player.y > WORLD.height) { player.x = 100; player.y = 300; player.velX = 0; player.velY = 0; }

    camera.x = player.x - canvas.width / 2;
    if (camera.x < 0) camera.x = 0;
    if (camera.x > WORLD.width - canvas.width) camera.x = WORLD.width - canvas.width;
    
    document.getElementById("xPos").innerText = Math.floor(player.x);
    document.getElementById("yPos").innerText = Math.floor(player.y);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // Yeşillik / Neon Çimen Teması Matris Izgaraları
    ctx.strokeStyle = "rgba(16, 185, 129, 0.04)";
    for(let x=0; x<WORLD.width; x+=60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,WORLD.height); ctx.stroke(); }

    // Platform Çizimleri (V3 Orman ve Sarmaşık Teması)
    platforms.forEach(p => {
        ctx.fillStyle = p.isFinish ? "#f59e0b" : "#065f46"; 
        ctx.fillRect(p.x, p.y, p.width, p.height);
        
        // Parlak Yeşil Neon Şerit Üst Sınır
        ctx.fillStyle = p.isFinish ? "#fff" : "#34d399";
        ctx.fillRect(p.x, p.y, p.width, 6);
    });

    // Diğer Rakipleri Çiz
    for (let id in otherPlayers) {
        let op = otherPlayers[id];
        let opStats = CHARACTERS[op.char] || CHARACTERS.Moosey;
        ctx.fillStyle = opStats.color;
        ctx.globalAlpha = 0.55;
        ctx.fillRect(op.x, op.y, player.w, player.h);
        
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = "#fff";
        ctx.font = "bold 11px Arial";
        ctx.fillText(op.name, op.x, op.y - 8);
    }

    // Kendini Çiz
    ctx.fillStyle = CHARACTERS[selectedChar].color;
    ctx.fillRect(player.x, player.y, player.w, player.h);
    
    // Baktığı Yön Göz Detayı
    ctx.fillStyle = "#fff";
    let eyeX = player.facing === "right" ? player.x + player.w - 10 : player.x + 4;
    ctx.fillRect(eyeX, player.y + 8, 6, 6);

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function resizeGame() {
    const w = window.innerWidth, h = window.innerHeight, r = 800/450;
    if (w/h > r) { canvas.style.width = (h*r)+"px"; canvas.style.height = h+"px"; }
    else { canvas.style.width = w+"px"; canvas.style.height = (w/r)+"px"; }
}
window.addEventListener("resize", resizeGame);
</script>
</body>
</html>
